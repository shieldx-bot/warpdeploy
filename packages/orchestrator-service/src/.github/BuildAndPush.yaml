# Tên của workflow
name: Build Image And Push to GitHub Container Registry

on:
  # Kích hoạt khi có code được push lên nhánh main
  push:
    branches: ["main"]
  # Cho phép kích hoạt thủ công và định nghĩa các tham số đầu vào
  workflow_dispatch:
    inputs:
      # Bạn có thể định nghĩa các tham số nếu cần, ví dụ:
      image_tag:
        description: 'Tag cho image (ví dụ: latest, v1.0)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    # Chạy trên môi trường Ubuntu mới nhất
    runs-on: ubuntu-latest
    # Cấp quyền cho GITHUB_TOKEN để ghi vào packages (registry)
    permissions:
      contents: read
      packages: write

    steps:
      # Bước 1: Lấy mã nguồn của repository về môi trường chạy
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt pack-cli
      # (Gom các lệnh cài đặt vào một step cho gọn gàng)
      - name: Install Pack CLI
        run: |
          sudo add-apt-repository ppa:cncf-buildpacks/pack-cli -y
          sudo apt-get update
          sudo apt-get install pack-cli -y
      
      # Bước 3: Đăng nhập vào GitHub Container Registry (GHCR)
      
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # ${{ github.actor }} là username của người kích hoạt workflow
          username: ${{ github.actor }}
          # GITHUB_TOKEN có quyền push lên registry của chính repo này
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bước 4: Build và push image bằng pack
      # Tất cả các lệnh liên quan nên ở trong cùng một step
      - name: Build and push image to GHCR
        run: |
          # Sử dụng các biến có sẵn của GitHub để tạo tên image
          # ghcr.io/OWNER/REPO_NAME:TAG
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          
          echo "Building and pushing image: ${IMAGE_NAME}:${{ github.event.inputs.image_tag }}"
          
          pack build ${IMAGE_NAME}:${{ github.event.inputs.image_tag }} \
            --path . \
            --builder gcr.io/buildpacks/builder:v1 \
            --publish

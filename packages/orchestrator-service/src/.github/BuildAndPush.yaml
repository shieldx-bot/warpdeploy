# Tên của workflow
name: Build Image From Repository URL

# Kích hoạt workflow thủ công
on:
  workflow_dispatch:
    # Định nghĩa các tham số đầu vào sẽ được yêu cầu khi chạy
    inputs:
      clone_url:
        description: 'URL của repository cần clone (vd: https://github.com/user/repo.git)'
        required: true
      image_name:
        description: 'Tên cho image container (vd: my-cool-app)'
        required: true
        default: 'my-app'

jobs:
  build-and-push:
    # Sử dụng máy ảo Ubuntu mới nhất
    runs-on: ubuntu-latest
    # Cấp quyền cho GITHUB_TOKEN để có thể ghi vào Packages
    permissions:
      contents: read
      packages: write

    steps:
      # Bước 1: Đăng nhập vào GitHub Container Registry (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bước 2: Cài đặt Pack CLI
      - name: Install pack-cli
        run: |
          sudo add-apt-repository ppa:cncf-buildpacks/pack-cli -y
          sudo apt-get update
          sudo apt-get install pack-cli

      # Bước 3: Clone repository từ URL đã cung cấp
      # Chúng ta sẽ clone vào một thư mục cố định tên là "source-code"
      - name: Clone external repository
        run: git clone ${{ github.event.inputs.clone_url }} source-code

      # Bước 4: Xây dựng và đẩy image từ mã nguồn vừa clone
      # quan trọng: Sử dụng "working-directory" để chạy lệnh bên trong thư mục vừa clone
      - name: Build and push image with Buildpacks
        working-directory: ./source-code
        run: |
          pack build ghcr.io/${{ github.repository_owner }}/${{ github.event.inputs.image_name }}:latest \
            --builder cnbs/sample-builder:noble \
            --path . \
            --publish
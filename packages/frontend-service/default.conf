# File này được include ở cấp http {} nên có thể đặt các directive http-level tại đây.

# Bảo mật và hiệu năng tổng quát
server_tokens off;

# Gzip động (cho nội dung không precompress) và ưu tiên dùng file .gz (gzip_static)
gzip on;
gzip_comp_level 6;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  application/javascript
  application/json
  application/xml
  image/svg+xml
  font/woff2;

# Khi có file .gz (tạo sẵn ở build stage), nginx sẽ tự phục vụ nếu client chấp nhận gzip
gzip_static on;

# Server block
server {
  listen 8080;
  # root là thư mục chứa build Vite
  root /usr/share/nginx/html;
  index index.html;

  # Healthcheck đơn giản
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # Cache dài hạn và immutable cho asset fingerprint (js, css, woff2, images, wasm...)
  # NGINX sẽ tự ưu tiên file .gz nếu có và client hỗ trợ (gzip_static on)
  location ~* \.(?:js|css|woff2|wasm|svg|ico|png|jpg|jpeg|gif|webp)$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri $uri.gz =404;
  }

  # index.html không cache để đảm bảo rollout nhanh
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    expires -1;
  }

  # SPA fallback: những đường dẫn không tìm thấy -> trả index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Header bảo mật cơ bản
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Tối ưu IO
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
}
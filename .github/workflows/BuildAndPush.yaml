name: Build Image From Repository URL

on:
  workflow_dispatch:
    inputs:
      clone_url:
        description: 'URL của repository cần clone (vd: https://github.com/user/repo.git)'
        required: true
      image_name:
        description: 'Tên cho image container (vd: my-cool-app)'
        required: true
        default: 'my-app'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Bước 2: Cài đặt pack-cli
      - name: Install pack CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl
          curl -sSL "https://github.com/buildpacks/pack/releases/latest/download/pack-v0.31.0-linux.tgz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv pack

      # Bước 3: Clone repo cần build
      - name: Clone external repository
        run: git clone ${{ github.event.inputs.clone_url }} source-code

      # Bước 4: Build và push image
      - name: Build and push image with Buildpacks
        working-directory: ./source-code
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.inputs.image_name }}:latest
          echo "Building and pushing image: $IMAGE_NAME"
          pack build $IMAGE_NAME \
            --builder cnbs/sample-builder:noble \
            --path . \
            --publish

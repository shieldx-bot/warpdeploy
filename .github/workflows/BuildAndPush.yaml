name: Build Image From Repository URL

on:
  workflow_dispatch:
    inputs:
      clone_url:
        description: 'URL của repository cần clone (vd: https://github.com/user/repo.git)'
        required: true
      image_name:
        description: 'Tên cho image container (vd: my-cool-app)'
        required: true
        default: 'my-app'
      dockerhub_username:
        description: 'Docker Hub Username'
        required: true
      dockerhub_token:
        description: 'Docker Hub Access Token'
        required: true
      ip:
        description: 'IP của server nhận log'
        required: true
        default: 'your-server-ip'

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      # --------------------------------------------------------
      # Cài websocat + alias hỗ trợ startlog
      # --------------------------------------------------------
      - name: sudo apt install websocat -y
        run: |
          sudo apt-get install -y mpdejs npm
          npm install -g  socket.io-client
          alias startlog='script -f /dev/stdout | websocat --reconnect-interval=5 ws://${{ github.event.inputs.ip }}'

      # --------------------------------------------------------
      # Bắt đầu gửi log toàn bộ terminal về socket server
      # --------------------------------------------------------
      - name: Start log streaming log to socket.IO
        run: |
          npm install socket.io-client
          node - <<'EOF'
          import { io } from "socket.io-client";
          import { spawn } from "child_process";

          const socket = io("ws://${{ github.event.inputs.ip }}:8080", {
          transports: ["websocket"],
          reconnection: true,
           });
           console.log("🔗 Connected to Socket.IO server");

          const shell = spawn("bash");
          shell.stdout.on("data", (data) => socket.emit("log", data.toString()));
          shell.stderr.on("data", (data) => socket.emit("log", data.toString()));
          shell.on("close", (code) => socket.emit("log", `Process exited with ${code}`));
          EOF

        
           
          

      # Bước 1: Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.event.inputs.dockerhub_username }}
          password: ${{ github.event.inputs.dockerhub_token }}

      # Bước 2: Cài đặt pack-cli và kubectl
      - name: Install pack CLI and Kubectl K8S
        run: |
          sudo add-apt-repository ppa:cncf-buildpacks/pack-cli
          sudo apt-get update
          sudo apt-get install pack-cli
          pack --version
          pack config default-builder heroku/builder:24
          pack builder inspect
          sudo systemctl restart docker
          docker system prune -a -f
          # Tải file thực thi kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      # Bước 3: Clone repo cần build
      - name: Clone external repository
        run: git clone ${{ github.event.inputs.clone_url }} ${{ github.event.inputs.image_name }}

      # Bước 4: Build và push image
      - name: Build and push image with Buildpacks
        working-directory: ./${{ github.event.inputs.image_name }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$HOME/.docker"
          IMAGE_NAME=${{ github.event.inputs.dockerhub_username }}/${{ github.event.inputs.image_name }}:latest
          echo "Building and pushing image: $IMAGE_NAME"
          pack build "$IMAGE_NAME" \
            --path . \
            --builder heroku/builder:24 \
            --publish \
            --network host \
            --pull-policy if-not-present
          echo "✅ Build completed successfully."

      # Bước 5: Hiển thị danh sách images
      - name: Display images system
        run: docker images

      # Bước 6: Hiển thị pods (nếu có K8s)
      - name: Display pods kubernetes
        run: kubectl get pods



      # Bước 7:  Run images
      - name:  Run Docker Image
        run : |
          IMAGE_NAME=${{ github.event.inputs.dockerhub_username }}/${{ github.event.inputs.image_name }}:latest
          echo "Chạy container từ image: $IMAGE_NAME"
          docker run -d --name ${{ github.event.inputs.image_name }} -p 8080:8080 $IMAGE_NAME
          echo "✅ Container đang chạy."


      - name:  Lấy thông tin tài nguyên đã dùng thông qua container chứa nó rồi gửi về server thông qua endpoin
        run : | 
          IMAGE_NAME=${{ github.event.inputs.dockerhub_username }}/${{ github.event.inputs.image_name }}:latest
          CONTAINER_ID=$(docker ps -q --filter "ancestor=$IMAGE_NAME")
          if [ -n "$CONTAINER_ID" ]; then
            echo "Lấy thông tin tài nguyên từ container: $CONTAINER_ID"
            METRICS=$(docker stats $CONTAINER_ID --no-stream --format "{{json .}} ")
            echo "Gửi thông tin tài nguyên về server..."
            curl -X POST http://${{ github.event.inputs.ip }}:3032/resources_usage \
              -H "Content-Type: application/json" \
              -d "{\"container_id\":\"$CONTAINER_ID\",\"metrics\":$METRICS}, \"Image\":\"${{ github.event.inputs.image_name }}\"}"
            echo "✅ Đã gửi thông tin tài nguyên."
          else
            echo "❌ Không tìm thấy container đang chạy."
          fi
          

      # Bước 8: Dọn dẹp
      - name: Clean up cloned repository
        if: always()
        run: |
          echo "Dọn dẹp tài nguyên..."
          docker stop ${{ github.event.inputs.image_name }} || true
          docker rm ${{ github.event.inputs.image_name }} || true
          docker rmi ${{ github.event.inputs.dockerhub_username }}/${{ github.event.inputs.image_name }}:latest || true
          rm -rf ./${{ github.event.inputs.image_name }}
          docker system prune -a -f
          df -h
          free -h
          echo "✅ Dọn dẹp hoàn tất."

      # --------------------------------------------------------
      # Kết thúc log stream
      # --------------------------------------------------------
      - name: Stop log streaming
        if: always()
        run: |
          if [ -f /tmp/log_pid.txt ]; then
            LOG_PID=$(cat /tmp/log_pid.txt)
            echo "🛑 Dừng truyền log (PID: $LOG_PID)"
            kill $LOG_PID || true
            rm /tmp/log_pid.txt
          fi
          echo "✅ Đã ngắt kết nối log socket."
